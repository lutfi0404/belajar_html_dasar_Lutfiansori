<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kartu</title>
    <style>
        body{
            background-color: #f4f4f4;
            font-family: arial, sans-serif;
        }
        .kartu {
            background-color: white;
            width: 300px;
            margin: 50px auto;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #ddd;
          }
          .foto{
            border-radius: 50%;
            width: 100px;
          }
            .pekerjaan{
                color: gray;
                margin-top: -10px;
            }
            .btn-kontak{
            background-color: #6a8b0d;
            color: white;
            padding: 10px 20px;
            margin-left: 20px;
            border: none;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
            }
    </style>

</head>
<body>
    <div class="kartu">
        <img src="foto.jpg" alt="foto profil" class="foto">
        <h2>budi santoso</h2>
        <p class="pekerjaan">web developer</p>
        <p>Siswa X RPL bercita-cita membuat startup teknologi di indonesia</p>
        <button class="btn-kontak">Kontak</button>
    </div>
</body>
</html>
